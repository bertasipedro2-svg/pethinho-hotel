name: CI
on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
permissions:
  contents: read
jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
