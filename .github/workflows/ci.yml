name: CI
on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Block committed private keys and Supabase service-role JWTs
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -q -E -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' -- . ':!*.lock'; then
            echo "::error::Private key material detected in tracked files."
            exit 1
          fi
          if git grep -I -q -E -- 'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' -- . ':!*.lock'; then
            echo "::error::JWT-like token detected in application files. Review before merging."
            exit 1
          fi
      - name: Reject public exposure of privileged Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -n -E -- 'NEXT_PUBLIC_[A-Z0-9_]*(SERVICE_ROLE|SECRET_KEY|DATABASE_PASSWORD|DB_PASSWORD)' -- . ':!*.lock' ':!.github/workflows/**'; then
            echo "::error::Privileged credentials must never use NEXT_PUBLIC_ variables."
            exit 1
          fi
          if git grep -I -n -E -- 'NEXT_PUBLIC_SUPABASE_(SERVICE_ROLE_KEY|SECRET_KEY)' -- . ':!*.lock' ':!.github/workflows/**'; then
            echo "::error::Supabase privileged keys must remain server-side."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
