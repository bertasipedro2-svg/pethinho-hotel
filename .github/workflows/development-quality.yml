name: PETHINHO development quality

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build

  admin-safety-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify admin export guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -f src/app/admin/page.tsx
          grep -Fq 'disabled={visibleRows.length===0||truncated||freshnessInvalid||availabilityInvalid||bookingInvalid||readinessInvalid}' src/app/admin/page.tsx
          grep -Fq 'setLastUpdated(new Date().toISOString())' src/app/admin/page.tsx
          grep -Fq 'availabilityInvalid' src/app/admin/page.tsx
          grep -Fq 'Number.isFinite(value)' src/app/admin/page.tsx
          grep -Fq 'truncated' src/app/admin/page.tsx
          grep -Fq 'setInterval(()=>setNow(Date.now()),60_000)' src/app/admin/page.tsx
          test -f tests/sql/admin_booking_date_type_guard_contract.sql
          grep -Fq "booking_export_rejects_non_text_or_blank_dates" tests/sql/admin_booking_date_type_guard_contract.sql
          grep -Fq "validStartText" src/app/admin/page.tsx
          grep -Fq "validEndText" src/app/admin/page.tsx

  operational-rpc-security-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify operational RPC security contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/operational_rpc_security_contract.sql
          grep -Fq "all_search_path_hardened" tests/sql/operational_rpc_security_contract.sql
          grep -Fq "public_execute_revoked" tests/sql/operational_rpc_security_contract.sql
          grep -Fq "anon_execute_revoked" tests/sql/operational_rpc_security_contract.sql
          grep -Fq "authenticated_execute_preserved" tests/sql/operational_rpc_security_contract.sql

  booking-safety-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify booking safety contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/booking_capacity_safety_contract.sql
          grep -Fq "bookings_valid_interval_chk" tests/sql/booking_capacity_safety_contract.sql
          grep -Fq "booking_capacity_guard" tests/sql/booking_capacity_safety_contract.sql
          grep -Fq "invalid_booking_intervals" tests/sql/booking_capacity_safety_contract.sql
          grep -Fq "negative_capacity" tests/sql/booking_capacity_safety_contract.sql

  readiness-export-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify export requires operational readiness
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const availabilityReady=availability.some(x=>x.active);' src/app/admin/page.tsx
          grep -Fq 'const safe=/^[=+\\-@]/.test(raw)?String.fromCharCode(39)+raw:raw;' src/app/admin/page.tsx
          grep -Fq 'const readinessInvalid=!readiness||readiness.accommodations===0||readiness.services===0||!availabilityReady||availabilityCoverageInvalid;' src/app/admin/page.tsx
          grep -Fq 'readinessInvalid' src/app/admin/page.tsx
          grep -Fq 'const availabilityCoverageInvalid=!readiness||activeAvailability.length!==readiness.accommodations||activeAvailabilityIds.size!==activeAvailability.length;' src/app/admin/page.tsx
          grep -Fq 'typeof x.accommodation_id===\"string\"?x.accommodation_id.trim():\"\"' src/app/admin/page.tsx

  extension-schema-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify extension schema contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/extension_schema_contract.sql
          grep -Fq "installed_schema" tests/sql/extension_schema_contract.sql
          grep -Fq "moved_out_of_public" tests/sql/extension_schema_contract.sql

  finance-schema-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify finance schema contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/finance_schema_contract.sql
          grep -Fq "finance_entries" tests/sql/finance_schema_contract.sql
          grep -Fq "bookings" tests/sql/finance_schema_contract.sql

  publication-safety-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure homologation publication is manual-only
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/pages.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/pages.yml
          if grep -Fq 'branches: [development]' .github/workflows/pages.yml; then
            echo "Automatic publication from development is not allowed"
            exit 1
          fi

  finance-rls-admin-only-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify finance is admin-only
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/finance_rls_admin_only_contract.sql
          grep -Fq "finance_select_admin_only" tests/sql/finance_rls_admin_only_contract.sql
          grep -Fq "finance_insert_admin_only" tests/sql/finance_rls_admin_only_contract.sql
          grep -Fq "finance_settle_admin_only" tests/sql/finance_rls_admin_only_contract.sql
          grep -Fq "finance_non_admin_policy_present" tests/sql/finance_rls_admin_only_contract.sql

  booking-rpc-security-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify booking RPC security contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/booking_rpc_security_contract.sql
          grep -Fq "all_booking_rpcs_hardened" tests/sql/booking_rpc_security_contract.sql
          grep -Fq "all_booking_rpcs_staff_guarded" tests/sql/booking_rpc_security_contract.sql
          grep -Fq "public_execute_revoked" tests/sql/booking_rpc_security_contract.sql
          grep -Fq "anon_execute_revoked" tests/sql/booking_rpc_security_contract.sql
          grep -Fq "authenticated_execute_preserved" tests/sql/booking_rpc_security_contract.sql

  request-booking-rpc-security-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify request booking RPC security contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/request_booking_rpc_security_contract.sql
          grep -Fq "request_booking_present" tests/sql/request_booking_rpc_security_contract.sql
          grep -Fq "request_booking_search_path_hardened" tests/sql/request_booking_rpc_security_contract.sql
          grep -Fq "request_booking_auth_guarded" tests/sql/request_booking_rpc_security_contract.sql
          grep -Fq "request_booking_owner_guarded" tests/sql/request_booking_rpc_security_contract.sql
          grep -Fq "public_execute_revoked" tests/sql/request_booking_rpc_security_contract.sql
          grep -Fq "anon_execute_revoked" tests/sql/request_booking_rpc_security_contract.sql
          grep -Fq "authenticated_execute_preserved" tests/sql/request_booking_rpc_security_contract.sql

  booking-schema-integrity-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify booking schema integrity contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/booking_schema_integrity_contract.sql
          grep -Fq "required_schema_present" tests/sql/booking_schema_integrity_contract.sql
          grep -Fq "invalid_booking_intervals" tests/sql/booking_schema_integrity_contract.sql
          grep -Fq "negative_capacity" tests/sql/booking_schema_integrity_contract.sql
          grep -Fq "contract_passed" tests/sql/booking_schema_integrity_contract.sql
  booking-capacity-trigger-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify booking capacity enforcement contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/booking_capacity_trigger_contract.sql
          grep -Fq "capacity_trigger_present" tests/sql/booking_capacity_trigger_contract.sql
          grep -Fq "capacity_function_present" tests/sql/booking_capacity_trigger_contract.sql
          grep -Fq "contract_passed" tests/sql/booking_capacity_trigger_contract.sql
  booking-lifecycle-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify check-in and check-out lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/booking_lifecycle_contract.sql
          grep -Fq "bookings_status_check" tests/sql/booking_lifecycle_contract.sql
          grep -Fq "bookings_operational_accommodation_required" tests/sql/booking_lifecycle_contract.sql
          grep -Fq "bookings_valid_interval_chk" tests/sql/booking_lifecycle_contract.sql
          grep -Fq "checked_in" tests/sql/booking_lifecycle_contract.sql
          grep -Fq "checked_out" tests/sql/booking_lifecycle_contract.sql
          grep -Fq "contract_passed" tests/sql/booking_lifecycle_contract.sql

  availability-view-integrity-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify availability view integrity contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/availability_view_integrity_contract.sql
          grep -Fq "availability_view_present" tests/sql/availability_view_integrity_contract.sql
          grep -Fq "availability_duplicate_ids" tests/sql/availability_view_integrity_contract.sql
          grep -Fq "availability_values_consistent" tests/sql/availability_view_integrity_contract.sql
          grep -Fq "availability_contract_passed" tests/sql/availability_view_integrity_contract.sql

  finance-settlement-integrity-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify finance settlement date integrity contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/finance_settlement_integrity_contract.sql
          grep -Fq "settlement_date_constraint_present" tests/sql/finance_settlement_integrity_contract.sql
          grep -Fq "invalid_settlement_dates" tests/sql/finance_settlement_integrity_contract.sql
          grep -Fq "contract_passed" tests/sql/finance_settlement_integrity_contract.sql


  admin-booking-rpc-acl-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify admin booking RPC ACL contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_booking_rpc_acl_contract.sql
          grep -Fq "all_admin_rpcs_hardened" tests/sql/admin_booking_rpc_acl_contract.sql
          grep -Fq "all_admin_rpcs_staff_guarded" tests/sql/admin_booking_rpc_acl_contract.sql
          grep -Fq "authenticated_execute_revoked" tests/sql/admin_booking_rpc_acl_contract.sql
          grep -Fq "contract_passed" tests/sql/admin_booking_rpc_acl_contract.sql


  request-booking-ownership-acl-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify request booking ownership and ACL contract
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/request_booking_ownership_acl_contract.sql
          grep -Fq "request_booking_present" tests/sql/request_booking_ownership_acl_contract.sql
          grep -Fq "search_path_hardened" tests/sql/request_booking_ownership_acl_contract.sql
          grep -Fq "auth_guard_present" tests/sql/request_booking_ownership_acl_contract.sql
          grep -Fq "owner_guard_present" tests/sql/request_booking_ownership_acl_contract.sql
          grep -Fq "public_execute_revoked" tests/sql/request_booking_ownership_acl_contract.sql
          grep -Fq "anon_execute_revoked" tests/sql/request_booking_ownership_acl_contract.sql
          grep -Fq "authenticated_execute_preserved" tests/sql/request_booking_ownership_acl_contract.sql
          grep -Fq "contract_passed" tests/sql/request_booking_ownership_acl_contract.sql

  admin-csv-formula-injection-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify CSV formula neutralization
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_csv_formula_injection_contract.sql
          grep -Fq "String.fromCharCode(39)+raw" src/app/admin/page.tsx
          grep -Fq "replaceAll" src/app/admin/page.tsx


  admin-export-freshness-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify export freshness guard
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_export_freshness_contract.sql
          grep -Fq 'const freshnessInvalid=!Number.isFinite(lastUpdatedMs)||lastUpdatedMs>now||now-lastUpdatedMs>5*60*1000;' src/app/admin/page.tsx
          grep -Fq 'disabled={visibleRows.length===0||truncated||freshnessInvalid||availabilityInvalid||bookingInvalid||readinessInvalid}' src/app/admin/page.tsx


  admin-availability-integrity-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify availability duplicate-id guard
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_availability_integrity_contract.sql
          grep -Fq 'const ids=new Set<string>()' src/app/admin/page.tsx
          grep -Fq 'const malformedIdentity=!accommodationId||typeof x.accommodation_name!=="string"||!x.accommodation_name.trim()||typeof x.active!=="boolean";' src/app/admin/page.tsx
          grep -Fq 'const duplicate=!malformedIdentity&&ids.has(accommodationId);' src/app/admin/page.tsx
          grep -Fq 'x.occupied_now+x.available_now!==x.capacity' src/app/admin/page.tsx
          grep -Fq 'availabilityInvalid' src/app/admin/page.tsx


  admin-export-missing-timestamp-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify missing timestamp export guard
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_export_missing_timestamp_contract.sql
          grep -Fq 'const staleData=freshnessInvalid;' src/app/admin/page.tsx
          grep -Fq 'A consulta ainda não possui um timestamp válido.' src/app/admin/page.tsx


  admin-calendar-window-future-bound-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify future bound for reservation window
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_calendar_window_future_bound_contract.sql
          grep -Fq 'Number.isFinite(startsAt)&&startsAt>=now&&startsAt<=end' src/app/admin/page.tsx

  admin-availability-coverage-warning-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify availability coverage warning
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_availability_coverage_warning_contract.sql
          grep -Fq 'availabilityCoverageInvalid||!availabilityReady' src/app/admin/page.tsx

  admin-calendar-live-clock-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify live calendar clock dependency
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_calendar_live_clock_contract.sql
          grep -Fq 'const currentNow=now;' src/app/admin/page.tsx
          grep -Fq '},[rows,statusFilter,windowFilter,now]);' src/app/admin/page.tsx
          grep -Fq '},[visibleRows,now]);' src/app/admin/page.tsx


  admin-booking-required-fields-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify booking required-fields guard
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_booking_required_fields_contract.sql
          grep -Fq 'const bookingInvalid=useMemo' src/app/admin/page.tsx
          grep -Fq 'const normalizedStatus=typeof row.status==="string"?row.status.trim():"";' src/app/admin/page.tsx
          grep -Fq '!row.pet_name.trim()' src/app/admin/page.tsx


  admin-csv-whitespace-formula-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify whitespace-prefixed CSV formula neutralization
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_csv_whitespace_formula_contract.sql
          grep -Fq 'const formulaCandidate=raw.trimStart();' src/app/admin/page.tsx
          grep -Fq 'const safe=/^[=+\\-@]/.test(formulaCandidate)?String.fromCharCode(39)+raw:raw;' src/app/admin/page.tsx


  admin-booking-status-whitespace-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify normalized booking status guard
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_booking_status_whitespace_contract.sql
          grep -Fq 'const normalizedStatus=typeof row.status==="string"?row.status.trim():"";' src/app/admin/page.tsx
          grep -Fq 'allowedBookingStatuses.has(normalizedStatus)' src/app/admin/page.tsx


  admin-booking-status-filter-normalization-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify normalized booking status filter
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_booking_status_filter_normalization_contract.sql
          grep -Fq 'const normalizedStatus=typeof row.status==="string"?row.status.trim():"";' src/app/admin/page.tsx
          grep -Fq 'statusFilter==="all"||normalizedStatus===statusFilter' src/app/admin/page.tsx


  admin-summary-status-normalization-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify normalized status in admin summary
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_summary_status_normalization_contract.sql
          grep -Fq 'const normalizedStatus=typeof row.status==="string"?row.status.trim():""; counts[normalizedStatus]' src/app/admin/page.tsx
          grep -Fq 'const normalizedStatus=typeof x.status==="string"?x.status.trim():"";return ["approved","confirmed"].includes(normalizedStatus)' src/app/admin/page.tsx
          grep -Fq 'typeof x.status==="string"?x.status.trim():"")==="checked_in"' src/app/admin/page.tsx


  admin-availability-exact-identity-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify exact active accommodation identity coverage
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_availability_exact_identity_contract.sql
          grep -Fq 'select("id",{count:"exact"}).eq("active",true)' src/app/admin/page.tsx
          grep -Fq 'setActiveAccommodationIds(new Set((accommodationsResult.data||[]).map(x=>typeof x.id==="string"?x.id.trim():"")))' src/app/admin/page.tsx
          grep -Fq 'activeAccommodationIds.size!==readiness.accommodations' src/app/admin/page.tsx
          grep -Fq 'some(id=>!activeAvailabilityIds.has(id))' src/app/admin/page.tsx
          grep -Fq 'some(id=>!activeAccommodationIds.has(id))' src/app/admin/page.tsx


  admin-upcoming-status-label-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify normalized status label in upcoming bookings
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_upcoming_status_label_normalization_contract.sql
          grep -Fq 'labels[typeof x.status==="string"?x.status.trim():""]||x.status' src/app/admin/page.tsx


  admin-export-exact-coverage-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify exact availability coverage export guard
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/sql/admin_export_exact_coverage_guard_contract.sql
          grep -Fq 'disabled={visibleRows.length===0||truncated||freshnessInvalid||availabilityInvalid||bookingInvalid||readinessInvalid}' src/app/admin/page.tsx
          grep -Fq 'const availabilityCoverageInvalid=' src/app/admin/page.tsx
          grep -Fq 'availabilityCoverageInvalid||!availabilityReady' src/app/admin/page.tsx
