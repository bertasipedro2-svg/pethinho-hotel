name: PETHINHO development quality

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint

  admin-safety-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify admin export guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -f src/app/admin/page.tsx
          grep -Fq 'disabled={visibleRows.length===0||truncated||staleData||availabilityInvalid}' src/app/admin/page.tsx
          grep -Fq 'setLastUpdated(new Date().toISOString())' src/app/admin/page.tsx
          grep -Fq 'availabilityInvalid' src/app/admin/page.tsx
          grep -Fq 'truncated' src/app/admin/page.tsx
